<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SPED 4155 | Collaboration in Practice</title><style>
:root{--navy:#142740;--navy2:#203c5c;--gold:#c7a76b;--cream:#f8f6f1;--ink:#1b2c40;--muted:#5c6878;--line:#d9dee5;--ok:#276d58;--pale:#eaf2ed}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}header{background:var(--navy);color:white;padding:24px max(20px,calc((100vw - 1050px)/2));border-bottom:5px solid var(--gold)}.brand{font-size:12px;letter-spacing:.18em;color:#dfc99e;font-weight:800}.headrow{display:flex;justify-content:space-between;align-items:center;gap:16px}.headrow strong{font-size:20px}main{max-width:940px;margin:auto;padding:28px 20px 80px}.hero{background:var(--navy);color:white;padding:42px;border-radius:20px;box-shadow:0 12px 30px #13243d18}.eyebrow{font-size:12px;letter-spacing:.15em;text-transform:uppercase;font-weight:800;color:var(--gold)}h1{font-size:clamp(30px,5vw,49px);line-height:1.14;margin:12px 0}h2{font-size:clamp(25px,4vw,34px);line-height:1.2;margin:8px 0 16px}h3{margin:0 0 12px;font-size:20px}.hero p{max-width:670px;color:#e2e9ef;font-size:18px}.card{background:white;border:1px solid var(--line);border-radius:17px;padding:27px;margin:18px 0;box-shadow:0 3px 12px #162a4010}.case{background:#edf1f5;border-left:5px solid var(--gold);border-radius:10px;padding:18px 20px;margin:18px 0}.case p:last-child{margin-bottom:0}.case strong{color:var(--navy)}button{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:11px;padding:13px 18px;background:white;color:var(--ink);text-align:left}button:hover{border-color:var(--navy2);background:#f4f7fa}button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}.primary{background:var(--navy);color:white;border-color:var(--navy);font-weight:750;text-align:center}.primary:hover{background:var(--navy2);color:white}.primary:disabled{opacity:.45;cursor:not-allowed}.choices{display:grid;gap:10px;margin-top:16px}.choice{width:100%;display:flex;align-items:flex-start;gap:13px}.choice.selected{border:2px solid var(--navy);background:#edf2f7}.choice .letter{border-radius:7px;background:#e9edf1;min-width:28px;height:28px;text-align:center;line-height:28px;font-size:12px;font-weight:800}.feedback{padding:17px 19px;border-radius:12px;background:var(--pale);border-left:4px solid var(--ok);margin:16px 0}.feedback.review{background:#fff7e8;border-left-color:#b3873c}.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin:25px 0}.muted{color:var(--muted)}.progress{height:9px;background:#e0e4e9;border-radius:100px;overflow:hidden;margin:12px 0 7px}.progress span{height:100%;background:var(--gold);display:block;transition:width .25s}.stage{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.pill{font-size:12px;border-radius:30px;padding:7px 11px;background:#e6eaf0;color:var(--navy);font-weight:700}.pill.active{background:var(--navy);color:white}.pill.done{background:#dcebe4;color:#1e614b}.sortitems{display:grid;gap:10px;margin:15px 0}.sortrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(155px,240px);gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:13px;background:#fff}.sortrow select{width:100%;font:inherit;border:1px solid #b7c2cc;border-radius:9px;padding:10px;background:#f9fbfc;color:var(--ink)}.sequence{display:grid;gap:9px;margin:18px 0}.sequence button{display:flex;align-items:center;gap:12px;width:100%}.sequence button:disabled{cursor:default;opacity:.8}.sequence button.chosen{background:#e6f0ea;border-color:#8db9a5}.number{background:var(--navy);color:white;border-radius:50%;width:29px;height:29px;display:inline-grid;place-items:center;flex-shrink:0;font-size:13px;font-weight:800}.tiny{font-size:13px}.completion{border:2px solid var(--gold);background:white;border-radius:24px;padding:42px;text-align:center}.seal{display:inline-grid;place-items:center;width:86px;height:86px;border:3px solid var(--gold);border-radius:50%;font-size:42px;color:var(--ok);margin-bottom:12px}.completion h1{color:var(--navy)}.completion .quote{font-size:21px;color:var(--navy);font-weight:700;max-width:610px;margin:20px auto}.completion .stamp{background:#edf2f6;padding:16px;border-radius:12px;margin:22px auto;max-width:560px}.hide{display:none!important}footer{text-align:center;color:var(--muted);font-size:12px;margin-top:35px}@media(max-width:600px){.hero{padding:28px}.card{padding:20px}.sortrow{grid-template-columns:1fr}.completion{padding:24px}.headrow strong{font-size:15px}}@media print{header,.toolbar,.stage,footer,.no-print{display:none!important}body{background:white}main{padding:0}.completion{box-shadow:none;break-inside:avoid}}
</style></head><body><header><div class="headrow"><div><div class="brand">TENNESSEE TECH UNIVERSITY · SPED 4155</div><strong>Collaborative Practices</strong></div><span style="color:#dfc99e;font-size:13px">FINAL COURSE EXPERIENCE</span></div></header><main id="app"></main><script>
'use strict';
const chapters=[
{title:'The Team Comes Together',short:'The team',theme:'Roles, shared responsibility, and teamwork',intro:'Meet Jordan, a fourth-grade student who receives special education services. Jordan is thoughtful and curious, but has difficulty starting independent assignments and showing what they know in writing. You are Jordan’s special education teacher. Over the next few weeks, you will collaborate with the people who support Jordan.',activities:[
{type:'sort',title:'Who brings what?',prompt:'Match each contribution to the team member most likely to bring that perspective. These are starting points, not rigid boundaries.',options:['Family','General education teacher','Special education teacher','Paraeducator','Outside service provider'],items:[['Explains what helps Jordan feel confident with homework and routines at home.','Family'],['Describes how independent writing tasks unfold in the general classroom.','General education teacher'],['Connects Jordan’s IEP goals, specially designed instruction, and progress data.','Special education teacher'],['Shares observations from support provided during classroom routines.','Paraeducator'],['With appropriate consent, shares relevant strategies used in therapy outside school.','Outside service provider']],explain:'Each team member has valuable information. Effective collaboration combines perspectives rather than treating one voice as the only expert.'},
{type:'choice',title:'Start with listening',prompt:'The general education teacher says, “Jordan just waits for an adult to tell them what to do.” What is the best opening response?',options:['“We need to enforce the consequences more consistently.”','“Can you walk me through what happens just before Jordan stops working?”','“The IEP says we should provide assistance, so that is what we need to do.”'],correct:1,explain:'An open, nonjudgmental question helps the team define the problem before choosing a solution.'},
{type:'sequence',title:'A productive problem-solving meeting',prompt:'Select the steps in the most productive order.',items:['Clarify the shared concern and define the problem.','Gather perspectives and relevant information.','Agree on a feasible plan with clear responsibilities.','Decide how and when to review the results.'],explain:'A team moves from a shared problem definition to evidence, a coordinated plan, and follow-up.'},
{type:'choice',title:'Whose voice is missing?',prompt:'The team has discussed classroom data, but Jordan’s family has not been asked about their priorities. What should happen next?',options:['Finalize the plan and email the family a summary.','Invite the family to share priorities and concerns before decisions are finalized.','Wait until the next annual IEP meeting to discuss the plan.'],correct:1,explain:'Family partnership begins before a decision is made, not after the team has already settled on a plan.'}]},
{title:'Communication Changes Everything',short:'Communication',theme:'Listening, feedback, and difficult interactions',intro:'The team agrees that Jordan needs a more consistent approach, but the adults are not communicating as clearly as they think they are.',activities:[
{type:'sort',title:'What does that sound like?',prompt:'Sort each statement by whether it opens or closes productive dialogue.',options:['Opens dialogue','Closes dialogue'],items:[['“Tell me what you have noticed during writing time.”','Opens dialogue'],['“We already tried that. It never works.”','Closes dialogue'],['“I think we see the situation differently. Can we compare what we are seeing?”','Opens dialogue'],['“You need to follow the plan exactly because I wrote it.”','Closes dialogue'],['“Let me check that I understood your concern.”','Opens dialogue']],explain:'Productive communication seeks information, checks understanding, and keeps the conversation focused on shared goals.'},
{type:'choice',title:'Feedback without blame',prompt:'A colleague has not been using the agreed-upon visual directions. Which response is most effective?',options:['“You never follow through with our plans.”','“I noticed the visual directions were not available today. Is there a barrier we can solve together?”','“I will report that the plan was not followed.”'],correct:1,explain:'Specific observations plus a collaborative question make feedback actionable without assuming intent.'},
{type:'choice',title:'A difficult interaction',prompt:'A teacher says, “I do not have time to keep meeting about one student.” What is the strongest next move?',options:['Explain that collaboration is legally required and end the conversation.','Acknowledge the time concern and propose a focused, brief check-in tied to a shared goal.','Stop including the teacher in planning.'],correct:1,explain:'Recognizing a legitimate concern while proposing a practical next step can reduce defensiveness.'},
{type:'sort',title:'Feedback, consultation, or coaching?',prompt:'Choose the primary purpose of each interaction.',options:['Feedback','Consultation','Coaching'],items:[['A teacher describes an observation and offers a specific suggestion about a lesson.','Feedback'],['Two educators jointly analyze a student concern and develop a response.','Consultation'],['An educator observes instruction, models a strategy, and supports repeated practice and reflection.','Coaching']],explain:'These practices can overlap, but their purposes and the level of ongoing support differ.'}]},
{title:'Instruction Is a Team Effort',short:'Instruction',theme:'Co-teaching, planning, consultation, and coaching',intro:'Jordan’s team decides to strengthen writing instruction without separating Jordan from peers unnecessarily. The general and special education teachers plan together.',activities:[
{type:'sort',title:'Know the six models',prompt:'Match each classroom description to the co-teaching model.',options:['One teach, one observe','One teach, one assist','Station teaching','Parallel teaching','Alternative teaching','Team teaching'],items:[['One teacher leads while the other collects targeted observation data.','One teach, one observe'],['One teacher leads while the other circulates to provide brief assistance.','One teach, one assist'],['Students rotate through instructional groups or tasks led at different stations.','Station teaching'],['The class is divided into two groups receiving the same core instruction simultaneously.','Parallel teaching'],['One teacher instructs a smaller group for a specific purpose while the other leads the larger group.','Alternative teaching'],['Both teachers share instructional leadership and interactively deliver the same lesson.','Team teaching']],explain:'No single model is best for every lesson. Choose intentionally based on the learning goal and student needs.'},
{type:'choice',title:'Select a model for the goal',prompt:'Both teachers want to teach the same writing strategy with more opportunities for student responses. Which model best fits?',options:['Parallel teaching with two smaller groups','One teach, one observe every day','Alternative teaching that permanently separates Jordan'],correct:0,explain:'Parallel teaching can reduce group size while maintaining the same instructional objective for all students.'},
{type:'choice',title:'A planning conversation',prompt:'The team wants to know whether the new writing supports are helping. Which plan is strongest?',options:['Ask whether the lesson felt smoother.','Define the student behavior to measure, collect comparable samples, and set a review date.','Wait until the grading period ends and compare report card grades.'],correct:1,explain:'Clear indicators and a review plan make collaboration responsive to evidence rather than impressions alone.'},
{type:'choice',title:'When a strategy needs support',prompt:'A teacher understands the plan but has trouble using the new instructional routine consistently. What would be most useful?',options:['Give the teacher another copy of the written directions.','Offer modeling, practice, observation, and specific feedback through coaching.','Replace the teacher’s role with a paraeducator.'],correct:1,explain:'Coaching supports implementation through demonstration, practice, and feedback, rather than information alone.'}]},
{title:'Roles, Boundaries, and Trust',short:'Responsibilities',theme:'Paraeducators, professional roles, and problem solving',intro:'A paraeducator has been helping Jordan start tasks. The arrangement is well-intentioned, but Jordan has begun waiting for an adult prompt before doing anything independently.',activities:[
{type:'sort',title:'Who is responsible?',prompt:'Match each task to the most appropriate role. Work may be shared, but responsibility for instruction and supervision must be clear.',options:['Teacher responsibility','Paraeducator may implement with teacher direction','Team responsibility'],items:[['Design specially designed instruction and make instructional decisions.','Teacher responsibility'],['Use a teacher-developed prompting routine and record agreed-upon observations.','Paraeducator may implement with teacher direction'],['Review evidence and decide whether the collaborative plan needs adjustment.','Team responsibility'],['Provide supervision, training, and feedback about assigned support tasks.','Teacher responsibility'],['Support student participation in a planned routine without independently changing the learning goal.','Paraeducator may implement with teacher direction']],explain:'Paraeducators are essential team members, but teachers retain responsibility for instructional planning, oversight, and evaluation.'},
{type:'choice',title:'Help versus independence',prompt:'Jordan waits for the paraeducator to tell them every step. What is the most productive team response?',options:['Continue prompting immediately so Jordan finishes the assignment.','Review the prompting plan and intentionally fade support while monitoring independence.','Remove all assistance tomorrow to force independence.'],correct:1,explain:'The goal is access and learning, not simply getting the work done. Planned fading can support independent performance.'},
{type:'choice',title:'Disagreement on the team',prompt:'The paraeducator reports that the routine is not working, but a teacher says, “Just keep doing it.” What is the strongest response?',options:['Invite specific observations, revisit the goal, and clarify what can be adjusted by whom.','Tell the paraeducator that instructional decisions are not their concern.','Let the paraeducator independently replace the routine.'],correct:0,explain:'Respect the paraeducator’s observations while maintaining clear professional decision-making responsibilities.'},
{type:'sequence',title:'Respond to an implementation concern',prompt:'Select the steps in order.',items:['Listen to the concern and describe the observable problem.','Check the agreed-upon plan and the relevant evidence.','Clarify responsibilities and decide on an adjustment.','Communicate the revised plan and schedule follow-up.'],explain:'Strong teams use concerns as information, then make deliberate changes and check implementation.'}]},
{title:'Families and Outside Providers',short:'Family partnership',theme:'Family-centered collaboration, confidentiality, and shared decisions',intro:'Jordan’s family reports that homework has become stressful and shares that an outside occupational therapist has suggested a different writing support. This information may help the team, but it does not automatically determine the school’s plan.',activities:[
{type:'choice',title:'Begin with the family',prompt:'Jordan’s caregiver says, “It feels like the school already has a plan before you ask us anything.” What is the best response?',options:['“Our data show that the current plan is appropriate.”','“I am sorry it has felt that way. What are your priorities and what would you like us to understand?”','“We can discuss your concerns after we finish the agenda.”'],correct:1,explain:'Invite the family’s knowledge and priorities into the process before moving to recommendations.'},
{type:'sort',title:'Partnering beyond the school',prompt:'Sort the actions into appropriate or inappropriate practices.',options:['Appropriate','Inappropriate'],items:[['Ask the family whether they want the school and outside therapist to coordinate.','Appropriate'],['Send Jordan’s records to an outside provider without appropriate authorization.','Inappropriate'],['Discuss which outside strategies are relevant and feasible in the classroom.','Appropriate'],['Promise to implement every outside recommendation without team review.','Inappropriate'],['Use plain language and check that the family understands the team’s decisions.','Appropriate']],explain:'Coordinate with outside providers when appropriate and authorized. School teams still need to review recommendations in context and follow confidentiality requirements.'},
{type:'choice',title:'The outside recommendation',prompt:'The therapist suggests a support that differs from the classroom plan. What should the school team do?',options:['Adopt it immediately because the therapist is a specialist.','Dismiss it because the provider does not work for the school.','Consider the recommendation, relevant data, family input, and school responsibilities before deciding.'],correct:2,explain:'Outside expertise can inform educational decisions without replacing the school team’s collaborative decision-making responsibilities.'},
{type:'choice',title:'Close the loop',prompt:'The meeting ends with agreement to try a revised support. What makes the follow-up meaningful?',options:['Tell the family they can contact the school if there is a problem.','Share who will do what, what progress will be reviewed, and when the family will hear back.','Ask the family to monitor everything at home.'],correct:1,explain:'A clear plan, assigned responsibilities, and timely communication turn a meeting into a partnership.'}]},
{title:'Put It All Together',short:'The big picture',theme:'A final course synthesis',intro:'Several weeks have passed. Jordan is beginning assignments more independently, but written responses are still inconsistent. The team needs to decide what to do next. Use the entire course, not just one strategy.',activities:[
{type:'sort',title:'Find the best tool for the moment',prompt:'Choose the collaborative approach that best matches each need.',options:['Team problem solving','Co-teaching planning','Coaching','Family partnership','Paraeducator supervision'],items:[['The team has conflicting explanations for the same student concern.','Team problem solving'],['Two teachers need to decide how they will share instruction and assessment.','Co-teaching planning'],['A teacher needs guided practice and feedback with a new routine.','Coaching'],['The team needs to understand the caregiver’s priorities and home observations.','Family partnership'],['An instructional support routine is being implemented inconsistently by assigned staff.','Paraeducator supervision']],explain:'The best collaborative move depends on the problem, the people involved, and the purpose of the interaction.'},
{type:'choice',title:'Choose the next team move',prompt:'Jordan’s independent task initiation has improved, but writing quality has not. What should the team do?',options:['Celebrate the improvement, examine writing evidence, and revise the instructional plan for the remaining need.','Stop all supports because Jordan is now independent.','Keep every part of the plan unchanged until the annual review.'],correct:0,explain:'Collaboration is an ongoing cycle: identify progress, examine remaining needs, adjust instruction, and monitor the result.'},
{type:'sequence',title:'The collaboration cycle',prompt:'Build a cycle that can guide your future practice.',items:['Listen to students, families, and team members.','Define a shared goal using evidence.','Plan and implement with clear roles.','Review outcomes and adjust together.'],explain:'Collaboration is not a one-time meeting. It is a repeating process of listening, planning, acting, and learning.'},
{type:'choice',title:'One idea to carry forward',prompt:'Which statement best captures the purpose of effective collaboration? Choose the one that best represents the course.',options:['Collaboration works when every professional stays strictly in their own lane.','Collaboration means reaching agreement as quickly as possible.','Collaboration combines expertise, shared responsibility, and ongoing communication to improve student learning and participation.'],correct:2,explain:'Effective collaboration is relational, purposeful, evidence-informed, and centered on students and families.'}]}];
let chapter=0,activity=0,answer=null,sequence=[],confirmed=false,started=false,finished=false;const app=document.getElementById('app');const total=chapters.reduce((n,c)=>n+c.activities.length,0);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function completedCount(){return chapters.slice(0,chapter).reduce((n,c)=>n+c.activities.length,0)+activity}
function shell(content){app.innerHTML=content;window.scrollTo({top:0,behavior:'instant'})}
function start(){started=true;render()}
function intro(){shell(`<section class="hero"><div class="eyebrow">Your final course experience</div><h1>Collaboration in Practice</h1><p>One student. One team. Many decisions. Bring together the communication, instructional, and partnership skills you have developed in SPED 4155.</p><p><strong>About 45–60 minutes</strong> · Interactive · No grades or scores · No tracking</p><button class="primary" onclick="start()">Begin the experience →</button></section><section class="card"><h3>How this works</h3><p>You will make choices, match ideas, organize steps, and get immediate explanations. If a choice needs another look, you can try again. All matching and ordering activities work with clicks or taps, so dragging is never required.</p><p>Complete all six sections to reach the final screen. <strong>Take a screenshot of that screen and submit it in Canvas.</strong> Your work is not sent anywhere, and refreshing the page restarts the experience.</p></section><footer>SPED 4155 · Collaborative Practices</footer>`)}
function render(){if(!started)return intro();if(finished)return completion();const c=chapters[chapter],a=c.activities[activity],done=completedCount(),pct=Math.round(done/total*100);let content=`<div class="eyebrow" style="color:var(--navy)">SPED 4155 · Interactive wrap-up</div><div class="toolbar"><span class="muted">Section ${chapter+1} of ${chapters.length} · Activity ${activity+1} of ${c.activities.length}</span><strong>${pct}% complete</strong></div><div class="progress" role="progressbar" aria-label="Module progress" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${pct}%"></span></div><div class="stage">${chapters.map((ch,i)=>`<span class="pill ${i===chapter?'active':i<chapter?'done':''}">${i<chapter?'✓ ':''}${esc(ch.short)}</span>`).join('')}</div><section class="card"><div class="eyebrow" style="color:#997743">${esc(c.theme)}</div><h2>${esc(c.title)}</h2>${activity===0?`<div class="case"><strong>Continuing the story</strong><p>${esc(c.intro)}</p></div>`:''}<h3>${esc(a.title)}</h3><p>${esc(a.prompt)}</p>`;
if(a.type==='choice'){content+=`<div class="choices">${a.options.map((opt,i)=>`<button class="choice ${answer===i?'selected':''}" onclick="choose(${i})" ${confirmed?'disabled':''}><span class="letter">${String.fromCharCode(65+i)}</span><span>${esc(opt)}</span></button>`).join('')}</div>`}
if(a.type==='sort'){content+=`<p class="muted tiny">Choose a category for each card. You can change your selections before checking.</p><div class="sortitems">${a.items.map((item,i)=>`<div class="sortrow"><span>${esc(item[0])}</span><select aria-label="Category for item ${i+1}" onchange="setSort(${i},this.value)" ${confirmed?'disabled':''}><option value="">Choose a category…</option>${a.options.map(o=>`<option value="${esc(o)}" ${answer&&answer[i]===o?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`).join('')}</div>`}
if(a.type==='sequence'){content+=`<p class="muted tiny">Click each step in the order it should happen. Use “Start over” if you want to rearrange them.</p><div class="sequence">${a.items.map((item,i)=>`<button onclick="pickStep(${i})" ${confirmed||sequence.includes(i)?'disabled':''} class="${sequence.includes(i)?'chosen':''}"><span class="number">${sequence.includes(i)?sequence.indexOf(i)+1:'+'}</span>${esc(item)}</button>`).join('')}</div>${!confirmed?'<button onclick="sequence=[];render()">↺ Start order over</button>':''}`}
if(confirmed){content+=`<div class="feedback" role="status"><strong>Connection to the course</strong><p>${esc(a.explain)}</p></div>`}else if(answer&&answer.review){content+=`<div class="feedback review" role="status"><strong>Take another look</strong><p>${esc(answer.review)}</p></div>`}
content+=`<div class="toolbar"><span class="muted tiny">Explore, try, and learn. Nothing is scored.</span>${confirmed?`<button class="primary" onclick="next()">${chapter===chapters.length-1&&activity===c.activities.length-1?'View completion screen →':'Continue →'}</button>`:`<button class="primary" onclick="check()" ${!ready(a)?'disabled':''}>Check my thinking →</button>`}</div></section><footer>All interactions run in your browser. No names, responses, or scores are collected.</footer>`;shell(content)}
function ready(a){if(a.type==='choice')return Number.isInteger(answer);if(a.type==='sort')return Array.isArray(answer)&&answer.length===a.items.length&&answer.every(Boolean);return sequence.length===a.items.length}
function choose(i){answer=i;render()}function setSort(i,v){if(!Array.isArray(answer))answer=Array(chapters[chapter].activities[activity].items.length).fill('');answer[i]=v;const pos=window.scrollY;render();window.scrollTo(0,pos)}function pickStep(i){if(!sequence.includes(i))sequence.push(i);const pos=window.scrollY;render();window.scrollTo(0,pos)}
function check(){const a=chapters[chapter].activities[activity];if(!ready(a))return;let good=false;if(a.type==='choice')good=answer===a.correct;else if(a.type==='sort')good=a.items.every((x,i)=>answer[i]===x[1]);else good=sequence.every((x,i)=>x===i);if(good){confirmed=true;render()}else{if(a.type==='choice'){answer=null;render()}else if(a.type==='sort'){let wrong=a.items.map((x,i)=>answer[i]!==x[1]?i+1:null).filter(Boolean);answer.review=`Revisit card${wrong.length>1?'s':''} ${wrong.join(', ')}. Think about the purpose of each role or strategy.`;render()}else{sequence=[];render()}const target=document.querySelector('.card');const fb=document.createElement('div');fb.className='feedback review';fb.setAttribute('role','alert');fb.innerHTML='<strong>Not quite yet.</strong><p>Use what you learned this semester and try again. You can take as many attempts as you need.</p>';target.querySelector('.toolbar').before(fb);fb.scrollIntoView({behavior:'smooth',block:'nearest'})}}
function next(){if(!confirmed)return;const c=chapters[chapter];if(activity<c.activities.length-1)activity++;else if(chapter<chapters.length-1){chapter++;activity=0}else{finished=true;completion();return}answer=null;sequence=[];confirmed=false;render()}
function completion(){const date=new Date().toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'});shell(`<div class="completion"><div class="seal" aria-hidden="true">✓</div><div class="eyebrow" style="color:#9c783e">SPED 4155 · Collaborative Practices</div><h1>You've Put It All Together.</h1><p style="font-size:19px"><strong>Final Interactive Module Completed</strong></p><p>You completed all six sections and all ${total} interactive activities, connecting communication, teamwork, co-teaching, consultation, coaching, paraeducator collaboration, family partnerships, and outside service providers.</p><p class="quote">Collaboration is not something you do once. It is how you work together to support students.</p><div class="stamp"><strong>COMPLETION CONFIRMED</strong><br>SPED 4155 · Collaboration in Practice<br>${esc(date)}<br><span class="muted tiny">All six sections completed · No score assigned</span></div><p><strong>Take a screenshot of this entire completion screen and submit it to the Canvas assignment.</strong></p><p class="muted tiny">This screen is generated locally after the interactive activities. No information has been collected or transmitted.</p><button class="primary no-print" onclick="window.print()">Print or save this screen (optional)</button></div><footer>SPED 4155 · Tennessee Tech University · Collaborative Practices</footer>`)}
intro();
</script></body></html>
